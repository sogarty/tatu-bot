# Конфигурация сервиса на Render.
#
# Зачем этот файл: он делает развёртывание повторяемым и явным. Без него
# настройки живут только в панели Render, их легко случайно сломать, и
# непонятно, что именно запущено.
#
# ВАЖНО про данные: production принимает только постоянный PostgreSQL.
# Если DATABASE_URL не задан, приложение намеренно не проходит startup/health,
# чтобы заявки не сохранялись в эфемерную SQLite-базу.
#
# Секреты сюда НЕ пишутся: sync: false означает «значение задаётся в панели
# Render, в репозитории его нет».

services:
  - type: web
    name: tatu-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MASTER_TG_ID
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: MODE
        value: webhook
      - key: ENVIRONMENT
        value: production
      # Укажи точный origin Mini App без завершающего слеша.
      - key: ALLOWED_ORIGINS
        sync: false
      # Обязательная строка подключения Neon или другого PostgreSQL-провайдера.
      - key: DATABASE_URL
        sync: false
